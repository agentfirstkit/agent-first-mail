[package]
name = "agent-first-mail"
version = "0.9.0"
edition = "2024"
description = "Let your AI agent work your inbox — email pulled into plain files it reads, sorts, and drafts on your machine, with nothing sent until you confirm."
license = "MIT"
repository = "https://github.com/agentfirstkit/agent-first-mail"
readme = "README.md"
include = [
    "src/**",
    "tests/**",
    "templates/**",
    "openapi/**",
    "skills/**",
    "docs/**",
    "build.rs",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
    "clippy.toml",
]

[features]
default = ["api", "demo", "review"]
api = [
    "dep:axum",
    "dep:tokio",
    "tokio/macros",
    "tokio/net",
    "tokio/rt-multi-thread",
    "tokio/signal",
]
demo = [
    "dep:base64",
    "dep:tokio",
    "tokio/macros",
    "tokio/rt",
    "tokio/signal",
    "tokio/sync",
]
review = []

[[bin]]
name = "afmail"
path = "src/main.rs"

[dependencies]
# Local monorepo development uses sibling crates where needed; version keys keep
# packaging tied to the matching published crates.
agent-first-data = { version = "0.31.0", default-features = false, features = ["cli", "skill-admin", "stream-redirect", "yaml", "toml", "dotenv", "ini"] }
agent-first-slug = { version = "0.6.2", default-features = false }
axum = { version = "0.8", optional = true }
base64 = { version = "0.23", optional = true }
blake3 = "1.8.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
imap = { version = "3.0.0-alpha.15", default-features = false }
imap-proto = "0.16"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls", "pool"] }
mail-parser = { version = "0.11", features = ["full_encoding"] }
rustls-pemfile = "2.2.0"
rustls-connector = { version = "0.23", default-features = false, features = ["webpki-root-certs", "rustls--ring"] }
noyalib = "0.0.18"
minijinja = "2"
include_dir = "0.7"
mime_guess = { version = "2", default-features = false }
fs4 = "1.1"
atomic-write-file = "0.3"
ring = "0.17.14"
sanitize-filename = "0.6"
schemars = "1.2"
tokio = { version = "1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
xattr = "1.6.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }

[dev-dependencies]
imap-codec = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
