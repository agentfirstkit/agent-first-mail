[package]
name = "agent-first-mail"
version = "0.7.0"
edition = "2024"
description = "Let your AI agent work your inbox — email pulled into plain files it reads, sorts, and drafts on your machine, with nothing sent until you confirm."
license = "MIT"
repository = "https://github.com/agentfirstkit/agent-first-mail"
readme = "README.md"
include = [
    "afui/**",
    "src/**",
    "tests/**",
    "templates/**",
    "skills/**",
    "docs/**",
    "build.rs",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
    "clippy.toml",
]

[[bin]]
name = "afmail"
path = "src/main.rs"

[features]
default = ["ui"]
ui = ["dep:agent-first-ui"]

[dependencies]
# Local monorepo development uses sibling crates where needed; version keys keep
# packaging tied to the matching published crates.
# agent-first-config lib-only: `json` gives the serde_json bridge.
agent-first-config = { version = "0.1.0", default-features = false, features = ["json"] }
agent-first-data = { version = "0.16.0", features = ["cli-help", "cli-help-markdown", "skill-admin", "stream-redirect"] }
agent-first-slug = "0.1.0"
agent-first-ui = { version = "0.2.0", optional = true }
blake3 = "1.8.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["rustls-tls"] }
imap-proto = "0.16"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls", "pool"] }
mail-parser = { version = "0.11", features = ["full_encoding"] }
rustls-pemfile = "2.2.0"
rustls-connector = { version = "0.23", default-features = false, features = ["webpki-root-certs", "rustls--ring"] }
serde_yaml = "0.9.34"
minijinja = "2"
include_dir = "0.7"
mime_guess = { version = "2", default-features = false }
fs4 = "1.1"
atomic-write-file = "0.3"
ring = "0.17.14"
sanitize-filename = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
xattr = "1.6.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }

[dev-dependencies]
imap-codec = "1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
